name: PenguinOS Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y git curl python3

      - name: Download PenguinOS manifest
        run: |
          curl -fL \
            https://raw.githubusercontent.com/GamerX65/android_manifest/main/pinned-sources.json \
            -o pinned-sources.json

      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json

          with open("pinned-sources.json") as f:
              data = json.load(f)

          assert data["branch"] == "penguinos/android-17"

          for item in data["components"]:
              print("Repository:", item["repository"])
              print("Path:", item["path"])
              print("Revision:", item["upstreamRevision"])
              print()

          print("PenguinOS manifest validation: PASSED")
          PY

3. Simpan

1. Tekan Commit changes.
2. Pastikan branch "main".
3. Konfirmasi commit.

4. Jalankan workflow

Buka:

"GitHub Actions PenguinOS-Build" (https://reference-url-citation.invalid/1)

Pilih PenguinOS Source Audit → Run workflow.

Workflow ini baru memeriksa manifest, belum membangun ROM.

Kirim screenshot hasil Actions setelah dijalankan. Berikutnya kita siapkan pengambilan source dan evaluasi kemungkinan build menggunakan runner yang tersedia.
