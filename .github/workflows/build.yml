name: PenguinOS Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Download manifest
        run: |
          curl -fL https://raw.githubusercontent.com/GamerX65/android_manifest/main/pinned-sources.json -o pinned-sources.json

      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json

          with open("pinned-sources.json") as f:
              data = json.load(f)

          assert data["branch"] == "penguinos/android-17"

          for item in data["components"]:
              print(item["path"], item["repository"])

          print("PenguinOS manifest validation: PASSED")
          PY
